name: Update class library list
# Roger adds or removes EPUB files in library/; this rebuilds library/books.json so Lexora lists them.
on:
  push:
    branches: [main]
    paths: ["library/**.epub"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List the class library books
        run: python3 scripts/build_library.py
      - name: Commit the book list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library/books.json
          if ! git diff --cached --quiet; then
            git commit -m "Update class library book list"
            git push
          fi
